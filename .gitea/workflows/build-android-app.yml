name: Build and publish an android app

on:
  push:
    tags:
      - '*'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  TAURI_PROJECT_DIR: ./standalone-apps/tauri

jobs:
  build-android-app:
    runs-on: ubuntu-latest
    if: github.repository == 'MultiMote/niimblue'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        uses: dev-hanz-ops/install-gh-cli-action@v0.2.1
        with:
          gh-cli-version: 2.72.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865 cmake;3.31.6'
          log-accepted-android-sdk-licenses: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.TAURI_PROJECT_DIR }}/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Install tauri dependencies
        working-directory: ${{ env.TAURI_PROJECT_DIR }}
        run: npm ci

      - name: Build niimblue www
        working-directory: ${{ env.TAURI_PROJECT_DIR }}
        run: npm run build-www
        env:
          COMMIT_HASH: ${{ gitea.sha }}
          COMMIT_TAG: ${{ gitea.ref_name }}

      - name: Build tauri android app
        working-directory: ${{ env.TAURI_PROJECT_DIR }}
        run: npm run tauri -- android build --apk --split-per-abi
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865

      - name: Decode Keystore
        run: mkdir -p .keystore && echo $KEYSTORE_BASE_64 | base64 -d > .keystore/keystore.jks
        env:
          KEYSTORE_BASE_64: ${{ secrets.KEYSTORE_BASE_64 }}

      - name: Sign apks
        run: |
          BT="$ANDROID_HOME/build-tools/37.0.0"
          APK_BASE="$TAURI_PROJECT_DIR/src-tauri/gen/android/app/build/outputs/apk"
          APP_VERSION="${APP_VERSION#v}"
          for abi in arm64 arm x86 x86_64; do
            "$BT/zipalign" -f 4 "$APK_BASE/$abi/release/app-$abi-release-unsigned.apk" aligned-$abi.apk
            "$BT/apksigner" sign \
              --ks .keystore/keystore.jks \
              --ks-key-alias "$KEYSTORE_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEYSTORE_ALIAS_PASSWORD" \
              --out "niimblues-$APP_VERSION-$abi.apk" \
              aligned-$abi.apk
          done
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APP_VERSION: ${{ gitea.ref_name }}

      - name: Create draft release if it does not exist
        run: |
          if ! gh release view "${{ gitea.ref_name }}" -R MultiMote/niimblue >/dev/null 2>&1; then
            gh release create "${{ gitea.ref_name }}" \
              -R MultiMote/niimblue \
              --target "${{ gitea.sha }}" \
              --draft \
              --title "${{ gitea.ref_name }}" \
              --notes ""
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_UPLOAD_TOKEN }}

      - name: Update GitHub release
        run: gh release upload "${{gitea.ref_name}}" niimblues-*.apk -R MultiMote/niimblue --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_UPLOAD_TOKEN }}
