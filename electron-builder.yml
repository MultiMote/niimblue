{
  "appId": "com.niimblue.studio",
  "productName": "Niimblue Studio",
  "directories": {
    "output": "release"
  },
  "files": ["dist/**/*", "electron/dist/**/*", "package.json"],
  "win": {
    "target": ["nsis"],
    "icon": "build/icon.ico"
  },
  "nsis": {
    "oneClick": false,
    "allowToChangeInstallationDirectory": true,
    "perMachine": false
  },
  "mac": {
    "target": ["dmg"],
    "icon": "build/icon.png"
  },
  "linux": {
    "target": ["AppImage"],
    "icon": "build/icon.png"
  }
}
